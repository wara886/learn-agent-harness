claims:
  - id: dsh-agent-loop-tool-round-trip
    upstream: dsh
    statement: >-
      ReactLoopAgent 在一个完整 assistant message 中发现 tool-call 内容后，会执行这些调用并把 tool/call 与 tool/result 追加到 Session；未被结论型工具结束的结果会进入后续模型请求，assistant message 没有 tool-call 时该步以 completed 结束。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/agent-loop/src/agent.ts
        symbol: ReactLoopAgent.step
      - path: packages/core/agent-loop/src/tool-calls.ts
        symbol: executeToolCalls
      - path: packages/core/agent-loop/src/tool-calls.ts
        symbol: appendToolCall/appendToolResult
      - path: packages/core/agent-loop/tests/loop.spec.ts
        test: "round-trips tool calls: model requests tool → executes → result in next request"
    caveat: >-
      该声明只描述固定提交的默认循环路径，不保证模型会正确选择工具或忠实使用结果；max-tokens、取消、结论型工具、steering、失败结果与并行调度有额外分支。课程的“拒绝编造”来自确定性教学规则，不是 DSH 对任意模型输出的保证。
    usedBy:
      - lesson-01-tool-first-answer
    reviewStatus: approved

  - id: dsh-tools-execute-waterfall
    upstream: dsh
    statement: >-
      tools/execute 是 waterfall 事件；ToolRuntime 在分派单个已接受的工具执行时通过 ctx.waterfall 调用监听器，并以工具 body 作为末端 next。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/tools/src/index.ts
        symbol: "Events['tools/execute']"
      - path: packages/core/tools/src/index.ts
        symbol: ToolRuntime.dispatchScheduledExecution
    caveat: >-
      waterfall 描述单个工具调用的监听器分派方式，不等于多个工具调用的并发策略；批量调用是否重叠由 agent-loop 调度和工具的执行模式另行决定。
    usedBy:
      - lesson-01-tool-first-answer
    reviewStatus: approved

  - id: dsh-session-append-only-source
    upstream: dsh
    statement: >-
      SessionEventMap 定义的 Session 事件日志是追加式、可持久化的交互事实来源；Session.deriveMessages 不是直接返回全部事件，而是沿当前有序 surface 调用 deriveEventMessage 得到模型消息。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/session/src/types.ts
        symbol: SessionEventMap
      - path: packages/core/session/src/index.ts
        symbol: Session.append
      - path: packages/core/session/src/index.ts
        symbol: Session.deriveMessages
      - path: packages/core/session/tests/surface.spec.ts
        test: uses the surface path when surface markers are present
    caveat: >-
      “追加式”描述事件日志，不能推导为模型永远看到全部历史；surface replace 可以让旧 surface 节点不再参与派生消息，而原事件仍留在日志。持久化 backend、seed、格式版本和缓存不是本课结论的一部分。
    usedBy:
      - lesson-02-log-to-model-view
    reviewStatus: approved

  - id: dsh-session-surface-projection
    upstream: dsh
    statement: >-
      固定提交中只有 user/message、assistant/message 和 tool/result 属于 SurfaceEventType；deriveEventMessage 对其他事件返回 null，因此 turn/step 边界、assistant/chunk、todo/write 与 request/header 等 log-only 记录不会各自生成模型消息。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/session/src/types.ts
        symbol: SurfaceEventType
      - path: packages/core/session/src/surface.ts
        symbol: deriveEventMessage
      - path: packages/core/session/tests/surface.spec.ts
        test: surface path skips non-surface events (chunks, boundaries)
      - path: packages/core/session/src/types.ts
        symbol: "SessionEventMap['todo/write']"
    caveat: >-
      assistant/message 即使是 surface 节点，在 content 为空时也会投影为 null。tool/call 不是独立 surface 事件；模型请求的调用内容位于 assistant message 中。replace 与 sourceEventSeqs 的完整规则留到后续课程。
    usedBy:
      - lesson-02-log-to-model-view
    reviewStatus: approved

  - id: dsh-tools-registration-visible
    upstream: dsh
    statement: >-
      ToolRuntime.register 把通过校验的工具定义加入当前注册层；ToolRuntime.schemas 从当前可见工具生成模型侧 schema，system-prompt assembly 会收到已注册工具的 schema。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/tools/src/index.ts
        symbol: ToolRuntime.register
      - path: packages/core/tools/src/index.ts
        symbol: ToolRuntime.schemas
      - path: packages/core/tools/tests/tools.spec.ts
        test: registers tools, exposes schemas, and feeds the system-prompt assembly
    caveat: >-
      schema 可见性受 scope、shadowing、工具呈现模式和注册校验影响；schemas 只投影模型需要的字段，不暴露 execute、presentation callback 或 timeoutMs。课程只演示单一全局可见工具。
    usedBy:
      - lesson-03-register-and-remove-tool
    reviewStatus: approved

  - id: dsh-tools-registration-disposer
    upstream: dsh
    statement: >-
      ToolRuntime.register 通过 ScopedLayers.effect 建立注册并返回 ctx.effect 的 exact disposer；调用该 disposer 会撤销工具注册，拥有该注册的插件 fiber 释放时也会移除工具。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/core/tools/src/index.ts
        symbol: ToolRuntime.register
      - path: packages/core/scope/src/store.ts
        symbol: ScopedLayers.effect
      - path: packages/core/tools/tests/tools.spec.ts
        test: returns a callable disposer from register() that unregisters the tool
      - path: packages/core/tools/tests/tools.spec.ts
        test: rejects duplicate names and unregisters on fiber dispose (HMR safety)
      - path: packages/core/tools/tests/tools.spec.ts
        test: "register() returns the EXACT effect disposer: a composite yield nests the teardown in order"
    caveat: >-
      disposer 只撤销它拥有的那次注册；真实 teardown 还受 Cordis effect 的 LIFO 次序、scope 生命周期和异步 fiber quiescence 影响。课程中的同步开关不复现这些时序细节。
    usedBy:
      - lesson-03-register-and-remove-tool
    reviewStatus: approved

  - id: dsh-compaction-surface-replacement
    upstream: dsh
    statement: >-
      BasicCompactionEngine 在压力或显式请求下压缩选定的旧 surface 区段，记录 compaction 生命周期与摘要，再追加带 replace 操作的检查点消息；旧事件仍保留在日志中。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/compaction/compaction-basic/src/index.ts
        symbol: BasicCompactionEngine
      - path: packages/compaction/compaction-basic/src/region.ts
        symbol: compactSurfaceRegion
    caveat: >-
      压缩依赖模型容量、策略、稳定 surface 和摘要成功；失败时可能保留原 surface 并记录失败。课程只演示一次成功的确定性替换。
    usedBy:
      - lesson-04-compaction-checkpoint
    reviewStatus: approved

  - id: dsh-workflow-subagent-lifecycle
    upstream: dsh
    statement: >-
      Worker-thread workflow 的 agent() 调用由 host 桥接到具名 subagent provider；已发布的 child 以 workflow/agent-start 与 workflow/agent-end 成对记录，workflow/end 在整次运行结算时发出。
    classification: product-fact
    baseline: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    evidence:
      - path: packages/workflow/workflow-worker-thread/src/host.ts
        symbol: WorkerRun.startChild
      - path: packages/workflow/workflow/src/index.ts
        symbol: WorkflowEngine lifecycle events
    caveat: >-
      子 Agent 失败、取消、并发上限和结构化输出都有独立分支；课程只演示两个独立调查任务和一次汇总，不代表所有任务都适合并行。
    usedBy:
      - lesson-05-workflow-subagents
    reviewStatus: approved

  - id: pi-agent-loop-tool-round-trip
    upstream: pi
    statement: >-
      Pi agent loop 从 assistant message 收集 toolCall，按配置顺序或并行执行，并把 ToolResultMessage 加入上下文；只要仍有工具调用或排队消息，循环就继续。
    classification: product-fact
    baseline: c49906ec77788625aacbdc53ebca6fbe65bd20f5
    evidence:
      - path: packages/agent/src/agent-loop.ts
        symbol: runLoop
      - path: packages/agent/src/agent-loop.ts
        symbol: executeToolCalls
    caveat: >-
      顺序与并行模式、拦截 hook、终止提示、steering 和 follow-up 都会改变具体轮次路径。
    usedBy:
      - lesson-pi-01-tool-result-round-trip
    reviewStatus: approved

  - id: pi-agent-message-conversion
    upstream: pi
    statement: >-
      Pi 的 agent loop 保持 AgentMessage 上下文，只在每次模型调用前先运行可选 transformContext，再通过 convertToLlm 转成 Provider 可接受的 Message。
    classification: product-fact
    baseline: c49906ec77788625aacbdc53ebca6fbe65bd20f5
    evidence:
      - path: packages/agent/src/types.ts
        symbol: AgentLoopConfig.convertToLlm
      - path: packages/agent/src/agent-loop.ts
        symbol: streamAssistantResponse
    caveat: >-
      应用自定义消息必须自行转换或过滤；转换函数失败会中断低层循环，不能把 UI-only 消息直接发送给 Provider。
    usedBy:
      - lesson-pi-02-agent-message-conversion
    reviewStatus: approved

  - id: pi-extension-tool-registration
    upstream: pi
    statement: >-
      ExtensionAPI.registerTool 把定义写入当前 extension 的工具表并刷新 Session 工具注册表；reload 会使旧 runner 失效、重新加载资源并重建运行时工具表。
    classification: product-fact
    baseline: c49906ec77788625aacbdc53ebca6fbe65bd20f5
    evidence:
      - path: packages/coding-agent/src/core/extensions/loader.ts
        symbol: createExtensionAPI.registerTool
      - path: packages/coding-agent/src/core/agent-session.ts
        symbol: AgentSession._refreshToolRegistry/reload
    caveat: >-
      Pi 的 registerTool 返回 void，不是 DSH 风格的 exact disposer；撤下扩展工具依赖资源配置变化后 reload，而不是调用注册返回的清理函数。
    usedBy:
      - lesson-pi-03-extension-tool-registration
    reviewStatus: approved

  - id: pi-session-jsonl-tree
    upstream: pi
    statement: >-
      SessionManager 把会话保存为追加式 JSONL；条目的 id/parentId 形成树，leaf 指向当前位置。branch() 移动 leaf，下一次 append 从该位置创建新分支，而不改写旧分支。
    classification: product-fact
    baseline: c49906ec77788625aacbdc53ebca6fbe65bd20f5
    evidence:
      - path: packages/coding-agent/src/core/session-manager.ts
        symbol: SessionManager
      - path: packages/coding-agent/docs/session-format.md
        symbol: Tree Structure
    caveat: >-
      课程不展开格式迁移、compaction entry、branch summary、custom entry 或损坏文件恢复；当前结论固定在 session format v3 的实现。
    usedBy:
      - lesson-pi-04-session-tree
    reviewStatus: approved

  - id: pi-resource-loader-skills
    upstream: pi
    statement: >-
      DefaultResourceLoader 汇总启用的 skill 资源并调用 loadSkills；Skills 可以来自全局目录、项目目录、settings、CLI 或 Pi package，默认只把名称与描述放入上下文，完整 SKILL.md 按需读取。
    classification: product-fact
    baseline: c49906ec77788625aacbdc53ebca6fbe65bd20f5
    evidence:
      - path: packages/coding-agent/src/core/resource-loader.ts
        symbol: DefaultResourceLoader.reload/getSkills
      - path: packages/coding-agent/docs/skills.md
        symbol: Skill Locations / How Skills Work
    caveat: >-
      来源优先级、过滤、诊断和项目信任会改变最终资源集合；Skill 是提示与配套资源，不等于自动获得新的宿主权限。
    usedBy:
      - lesson-pi-05-resource-skills
    reviewStatus: approved
